name: demo-unidades

services:
  db:
    image: postgres:16.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-demo_unidades}
      POSTGRES_USER: ${DEMO_DB_OWNER:-demo_migraciones}
      POSTGRES_PASSWORD: ${DEMO_DB_OWNER_PASSWORD:?usar .env}
      DEMO_DB_APP_USER: ${DEMO_DB_APP_USER:-demo_app}
      DEMO_DB_APP_PASSWORD: ${DEMO_DB_APP_PASSWORD:?usar .env}
    volumes:
      - datos_db:/var/lib/postgresql/data
      - ./scripts/init_db_roles.sh:/docker-entrypoint-initdb.d/01_roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEMO_DB_OWNER:-demo_migraciones} -d ${POSTGRES_DB:-demo_unidades}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${DEMO_DB_APP_USER:-demo_app}:${DEMO_DB_APP_PASSWORD:?usar .env}@db:5432/${POSTGRES_DB:-demo_unidades}
      DATABASE_URL_MIGRACIONES: postgresql+psycopg://${DEMO_DB_OWNER:-demo_migraciones}:${DEMO_DB_OWNER_PASSWORD:?usar .env}@db:5432/${POSTGRES_DB:-demo_unidades}
      N8N_API_KEY: ${N8N_API_KEY:?usar .env}
      JWT_SECRET: ${JWT_SECRET:?usar .env}
      DMS_API_URL: http://dms:8100
      ACTAS_DIR: /actas
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./scripts:/srv/scripts:ro
      - ./datos_demo:/srv/datos_demo
      - actas_pdf:/actas
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/salud',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_BASE_URL: http://api:8000/api/v1
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  dms:
    build:
      context: .
      dockerfile: dms_simulado/Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8100/salud',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  test:
    build:
      context: .
      dockerfile: backend/Dockerfile.test
    profiles: ["test"]
    env_file: .env
    environment:
      BACKEND_DIR: /srv/backend
      PLANIFICADOR_ACTIVO: "false"  # la sincronizacion real alteraria a los usuarios de prueba
      PYTHONPATH: /srv/backend:/srv/n8n
      TEST_DB_NAME: ${TEST_DB_NAME:-demo_unidades_test}
      DATABASE_URL: postgresql+psycopg://${DEMO_DB_APP_USER:-demo_app}:${DEMO_DB_APP_PASSWORD:?usar .env}@db:5432/${TEST_DB_NAME:-demo_unidades_test}
      DATABASE_URL_MIGRACIONES: postgresql+psycopg://${DEMO_DB_OWNER:-demo_migraciones}:${DEMO_DB_OWNER_PASSWORD:?usar .env}@db:5432/${TEST_DB_NAME:-demo_unidades_test}
      DMS_API_URL: http://dms:8100
    working_dir: /srv
    volumes:
      - ./tests:/srv/tests:ro
      - ./n8n:/srv/n8n:ro
      - ./backend:/srv/backend:ro
      - ./scripts:/srv/scripts:ro
      - ./datos_demo:/srv/datos_demo:ro
      - ./pytest.ini:/srv/pytest.ini:ro
    depends_on:
      db:
        condition: service_healthy
      dms:
        condition: service_healthy
    command: python -m pytest -q

  traccar:
    image: traccar/traccar:6.4
    ports:
      - "127.0.0.1:8082:8082"
      - "127.0.0.1:5055:5055"
    volumes:
      - datos_traccar:/opt/traccar/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/api/server || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  n8n:
    build:
      context: ./n8n
    ports:
      - "127.0.0.1:5678:5678"
    # Importa la casilla y el flujo en cada arranque y lo deja activo
    entrypoint: >
      sh -c "n8n import:credentials --input=/flujos/credenciales_imap.json &&
      n8n import:workflow --input=/flujos/flujo_actas.json &&
      n8n update:workflow --id=flujoactasdemo01 --active=true &&
      exec n8n start"
    depends_on:
      api:
        condition: service_healthy
      mail:
        condition: service_started
    environment:
      N8N_API_KEY: ${N8N_API_KEY:?usar .env}
      GENERIC_TIMEZONE: America/Argentina/Buenos_Aires
      TZ: America/Argentina/Buenos_Aires
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: ${N8N_CLAVE_ADMIN:-demo-n8n}
    volumes:
      - datos_n8n:/home/node/.n8n
      - actas_pdf:/actas
      - ./n8n:/flujos:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  mail:
    image: greenmail/standalone:1.6.15
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=administracion:casilla-de-prueba@demo.local
    ports:
      - "127.0.0.1:3025:3025"

  nginx:
    image: nginx:1.27.1-alpine-slim
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  datos_db:
  actas_pdf:
  datos_n8n:
  datos_traccar:

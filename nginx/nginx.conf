# Proxy inverso del prototipo: TLS, cabeceras de seguridad y ruteo / -> web, /api -> api.
worker_processes auto;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream streamlit_web { server web:8501; }
    upstream fastapi_api   { server api:8000; }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Cabeceras de seguridad
        add_header X-Frame-Options            "SAMEORIGIN"       always;
        add_header X-Content-Type-Options     "nosniff"          always;
        add_header Referrer-Policy            "no-referrer"      always;
        add_header Strict-Transport-Security  "max-age=31536000" always;
        server_tokens off;

        location /api/ {
            proxy_pass http://fastapi_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Websocket interno de Streamlit
        location ^~ /_stcore/stream {
            proxy_pass http://streamlit_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
        }

        location / {
            proxy_pass http://streamlit_web;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

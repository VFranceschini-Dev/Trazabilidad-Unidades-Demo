[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Depends() en argumentos de FastAPI es el patron idiomático

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/app/core"]
ignore_missing_imports = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = "jwt.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]

[tool.coverage.run]
source = ["backend/app/core", "backend/app/unidades", "backend/app/identidad", "backend/app/sincronizacion"]

[tool.coverage.report]
fail_under = 80
show_missing = true
